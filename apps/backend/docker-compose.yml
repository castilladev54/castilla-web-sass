services:
  # ─── MongoDB (Replica Set required for transactions) ──────────
  mongo:
    image: soldevelo/mongodb:7.0
    container_name: inventory-mongo
    restart: unless-stopped
    environment:
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      MONGODB_ROOT_USER: ${MONGO_USER:?error}
      MONGODB_ROOT_PASSWORD: ${MONGO_PASSWORD:?error}
      MONGODB_DATABASE: inventarioCrud
    volumes:
      - mongo_data:/bitnami/mongodb
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Backend API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      # Use the user-defined variables for connection
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/inventarioCrud?authSource=admin&replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?error}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN:?error}
      MAILTRAP_ENDPOINT: ${MAILTRAP_ENDPOINT:-https://send.api.mailtrap.io}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:?error}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
